sources:
  - name: google_sheets
    database: DEV_BRONZE_DB
    schema: google_sheets
    tables:
      - name: budget
        columns:
          - name: _row
            data_tests: [not_null, unique]
          - name: PRODUCT_ID
            data_tests:
              - relationships:
                  arguments:
                    to: ref('stg_sql_server_dbo__products')
                    field: PRODUCT_ID